[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutefl"
version = "0.1.0"
description = "Skill-centric function-level fault localization prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evolutefl = "evolutefl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
